{%- assign profile = site.data.profile -%}
<section class="hero" aria-label="About the author">
  <img class="hero-avatar" src="{{ profile.avatar | relative_url }}" alt="{{ profile.name }}" width="88" height="88" />
  <h1 class="hero-name">{{ profile.hero_title | default: profile.name }} {{ profile.greeting }}</h1>
  {%- if profile.tagline -%}<p class="hero-eyebrow">{{ profile.tagline }}</p>{%- endif -%}
  {%- if include.intro and include.intro != "" -%}<p class="hero-intro">{{ include.intro }}</p>{%- endif -%}
</section>
