<footer class="footer container">
  {% include socials.html %}
  <p class="footer-meta">&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }} · Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a></p>
</footer>

<button id="back-to-top" class="icon-button back-to-top" type="button" aria-label="Back to top">
  {% include icon.html name="arrow-up" %}
</button>

<script src="/assets/js/main.js" defer></script>

{%- if page.url == '/blog/' -%}
<script src="/assets/js/search.min.js"></script>
<script>
  SimpleJekyllSearch({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('search-results'),
    json: '/assets/search.json',
    searchResultTemplate: '<li><a href="{url}">{title}</a></li>',
    noResultsText: '<li class="search-empty">No results found</li>',
  });
</script>
{%- endif -%}
