name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # The Tina admin only changes when its config or dependencies do, so reuse the
      # last build for content-only pushes (most CMS saves) and skip Node entirely.
      - name: Restore Tina admin build
        id: tina-cache
        uses: actions/cache@v4
        with:
          path: |
            admin/index.html
            admin/assets
          key: tina-admin-${{ hashFiles('tina/config.ts', 'tina/tina-lock.json', 'package-lock.json') }}

      - name: Setup Node
        if: steps.tina-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install TinaCMS
        if: steps.tina-cache.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: Build with TinaCMS
        if: steps.tina-cache.outputs.cache-hit != 'true'
        env:
          TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_BRANCH: ${{ secrets.TINA_BRANCH }}
        # Don't block site deploys on TinaCloud's schema index; it only affects /admin
        # and catches up after TinaCloud re-indexes the branch.
        run: npx tinacms build --skip-cloud-checks

      - name: Cache slide thumbnails
        uses: actions/cache@v4
        with:
          path: .cache/thumbs
          key: slide-thumbs-${{ hashFiles('_data/home.yml', '_data/projects.yml') }}
          restore-keys: slide-thumbs-

      - name: Build Jekyll
        run: bundle exec jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
