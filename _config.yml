# Site settings
title: isfa.dev # site title
description: Software Engineer  # site description
lang: en-US # default lang
timezone: Asia/Jakarta # set your timezone
image: assets/img/ogp.png # This image used for Open Graph more info https://ogp.me/
repo: https://github.com/isfaaghyth/withisfa # site repo [optional]
mode: dark # default theme "dark" | "light"
google_analytics: G-XP2EHVCFFT

# Profile settings
# Profile content (name, bio, avatar, social links) lives in _data/profile.yml
# and is edited through TinaCMS. `author` is kept only for jekyll-feed metadata.
author:
  name: Muh Isfhani Ghiath
  email: isfa@ghiath.id

# URL settings
url: "https://isfa.dev/" #
baseurl:
permalink: /:title/
google_analytics: G-XP2EHVCFFT # leave it blank if not wish
fb_appid:

# Collection setting
collections:
  posts:
    output: true

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      # Posts are written in the CMS and often contain code like `{%s}`;
      # don't treat their content as Liquid templates.
      render_with_liquid: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
# theme: klise
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec
  - tina/__generated__
  - tina
  - openspec
  - package.json
  - package-lock.json

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
